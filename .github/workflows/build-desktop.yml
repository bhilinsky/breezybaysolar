name: Build desktop installers

on:
  workflow_dispatch:
  push:
    branches:
      - claude/warehouse-store-jewelry-tracking-oapreo

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-installer
          - os: macos-latest
            artifact: mac-installer
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: wms-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          VITE_SUPABASE_URL: https://zngvuieipmuwobwcdptq.supabase.co
          VITE_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpuZ3Z1aWVpcG11d29id2NkcHRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3ODIzOTgsImV4cCI6MjA5OTM1ODM5OH0.YYGstz5vCybq_lP70EfhqJzK6HhIuqfu4HiIaOgS-qg

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            wms-app/release/*.exe
            wms-app/release/*.dmg
            wms-app/release/*.blockmap
          if-no-files-found: warn
